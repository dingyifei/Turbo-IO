name: Developer SDK
on:
  pull_request:
    paths:
      - 'dashboard-service/**'
      - 'app-gallery/**'
      # The live sources the native tests compile (dashboard-service/tests/native_sources.py)
      - 'firmware/src/app-runtime-v1/**'
      - 'firmware/src/common-v1/**'
      - 'firmware/src/navigation-runtime-v1/**'
      - 'firmware/src/menu8-renderer.h'
      - 'firmware/src/firmware_profile.h'
      - 'firmware/src/stock_layout.h'
      - 'firmware/tests/host_layout.py'
      - 'firmware/build.py'
      - 'firmware/build-inputs.json'
      - 'ios-addon/app.[ch]'
      - 'ios-addon/app_view.[ch]'
      - 'ios-addon/AppPackage.[hm]'
      - 'ios-addon/EditorBackend.[hm]'
      - 'ios-addon/EditorModel.[hm]'
      - 'ios-addon/TIOLanguage.[hm]'
      - 'ios-addon/TIOTextLanguage.[hm]'
      - 'ios-addon/Localization.m'
      - 'skills/turboio-developer/**'
      - '.github/workflows/developer-sdk.yml'
  push:
    branches: [main]
    paths:
      - 'dashboard-service/**'
      - 'app-gallery/**'
      # The live sources the native tests compile (dashboard-service/tests/native_sources.py)
      - 'firmware/src/app-runtime-v1/**'
      - 'firmware/src/common-v1/**'
      - 'firmware/src/navigation-runtime-v1/**'
      - 'firmware/src/menu8-renderer.h'
      - 'firmware/src/firmware_profile.h'
      - 'firmware/src/stock_layout.h'
      - 'firmware/tests/host_layout.py'
      - 'firmware/build.py'
      - 'firmware/build-inputs.json'
      - 'ios-addon/app.[ch]'
      - 'ios-addon/app_view.[ch]'
      - 'ios-addon/AppPackage.[hm]'
      - 'ios-addon/EditorBackend.[hm]'
      - 'ios-addon/EditorModel.[hm]'
      - 'ios-addon/TIOLanguage.[hm]'
      - 'ios-addon/TIOTextLanguage.[hm]'
      - 'ios-addon/Localization.m'
      - 'skills/turboio-developer/**'
      - '.github/workflows/developer-sdk.yml'
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --locked --directory dashboard-service
      - run: uv run --directory dashboard-service pytest -q
