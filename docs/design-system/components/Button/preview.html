<!-- @dsCard group="Phone" height=300 subtitle="Primary filled, secondary tinted, destructive, disabled" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Button</title>
<style>
  body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
  .wrap{padding:16px;display:flex;flex-direction:column;gap:12px}

  .b{display:flex;align-items:center;justify-content:center;gap:var(--space-2);height:var(--button-height);border-radius:var(--radius-pill);border:0;width:100%;font:inherit}
  .primary{background:var(--accent-fill);color:var(--on-accent)}
  .secondary{background:var(--accent-soft);color:var(--accent)}
  .danger{background:transparent;color:var(--status-danger)}
  .disabled{background:var(--bg-sunken);color:var(--label-tertiary)}
  .b:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}
  .row{display:flex;gap:var(--space-3)}
</style></head><body>
<div class="wrap">
  <button class="b primary headline">Install update</button>
  <div class="row"><button class="b secondary headline">Preview</button><button class="b secondary headline">Send to glasses</button></div>
  <button class="b danger headline">Stop navigation</button>
  <button class="b disabled headline" disabled aria-disabled="true">Waiting for glasses…</button>
</div>
</body></html>
