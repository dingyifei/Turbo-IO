<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Turbo IO</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--label); font-family:var(--font-display); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .lens { fill:var(--lens-black); }
  .t { fill:var(--lens-mid); }
  .m { fill:var(--lens-high); }
  .b { fill:var(--lens-full); }
  .caret { fill:var(--lens-full); }
  .lime { fill:var(--accent-fill); }
  .soft { fill:var(--accent-soft); }
  .slab { rx:var(--radius-md); }
  .strip { rx:var(--radius-xs); }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-size:88px; line-height:.92; font-weight:700; letter-spacing:-.02em; color:var(--label); }
  .tag { margin:var(--space-3) 0 0 3px; font-family:var(--font-sans); font-size:14px; line-height:20px; color:var(--label-secondary); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      lens-black 304×240 lens slab bled off the top-right (the glasses' window), accent-fill 112×176 lime slab (the phone), accent-soft 112×48 relief tile, about 40% of 960×288
  arrangement one tall lens slab with two phone satellites on its left, bottoms aligned space-6 above the edge, space-4 gutters
  pattern     literal motif, the system's own priority bands: three strips inside the lens slab rising in brightness and height toward the bottom (lens-mid, lens-high, lens-full), plus the 24×3 focus caret, "priority runs bottom-up"
  scales      slab sides in space-4 multiples; gutters space-4; strip heights 12/20/32 at 8px steps; corners radius-md (slabs), radius-xs (strips, caret)
-->
<rect class="soft slab" x="16" y="216" width="112" height="48" rx="12"/>
<rect class="lime slab" x="16" y="24" width="112" height="176" rx="12"/>
<rect class="lens slab" x="144" y="-16" width="352" height="280" rx="12"/>
<rect class="t strip" x="176" y="72" width="152" height="12" rx="2"/>
<rect class="m strip" x="176" y="128" width="232" height="20" rx="2"/>
<rect class="b strip" x="176" y="188" width="280" height="32" rx="2"/>
<rect class="caret strip" x="176" y="232" width="24" height="3" rx="2"/>
</svg>
</div>
<div class="words">
  <h1 class="name">Turbo IO</h1>
  <p class="tag">One system for the phone you set up and the glasses you glance at.</p>
</div>
</div>
</body>
</html>
