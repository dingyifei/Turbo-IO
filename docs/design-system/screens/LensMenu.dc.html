<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glasses menu</title>

<body>
<x-dc>

    <svg style="position: absolute; left: 0; top: 0;" width="1080" height="440" viewBox="0 0 540 220" aria-hidden="true">
      <rect x="258" y="27" width="12" height="4" rx="2" fill="#00b000"/>
      <rect x="276" y="27" width="4" height="4" rx="2" fill="#007700"/>

    <div style="position: absolute; right: 80px; top: 47px; font-size: 36px; line-height: 1; color: #007700;">82</div>
    <div style="position: absolute; left: 104px; width: 160px; top: 190px; text-align: center; font-size: 32px; line-height: 1; color: #007700;">Music</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bands":{"editor":"boolean","default":true},"$preview":{"width":1160,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return { bands: this.props.bands ?? true };
  }
}
</script>
</body>
</html>
