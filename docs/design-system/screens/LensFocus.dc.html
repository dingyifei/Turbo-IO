<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glasses focus timer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1160px; height: 560px; box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; gap: 10px; background: #1c1c1e; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', system-ui, sans-serif;">
  <div style="font-size: 13px; font-weight: 600; color: #c7c7cc; letter-spacing: .02em;">Proposed · TMG7 Pomodoro · today the hint footer sits at {16,150,508,24}</div>
  <div role="img" aria-label="Proposed focus timer: 18 minutes 42 seconds in the bottom band, next break in the middle, progress track and session 2 of 4 at the top" style="width: 1080px; height: 360px; position: relative; overflow: hidden; border-radius: 16px; background: #000000;">
    <div style="position: absolute; left: 80px; top: 88px; width: 920px; height: 8px; border-radius: 4px; background: #003800;"></div>
    <div style="position: absolute; left: 80px; top: 88px; width: 236px; height: 8px; border-radius: 4px; background: #00ff00;"></div>
    <div style="position: absolute; left: 80px; top: 39px; font-size: 36px; line-height: 1; color: #007700;">Focus</div>
    <div style="position: absolute; right: 80px; top: 39px; font-size: 36px; line-height: 1; color: #007700; font-variant-numeric: tabular-nums;">2 / 4</div>
    <div style="position: absolute; left: 80px; top: 160px; font-size: 40px; line-height: 1; color: #00b000;">Break at 10:35</div>
    <div style="position: absolute; left: 80px; top: 255px; font-size: 96px; line-height: 1; font-weight: 500; color: #00ff00; font-variant-numeric: tabular-nums;">18:42</div>
    <sc-if value="{{bands}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; left: 0; top: 0; width: 1080px; height: 24px; background: rgba(255,122,26,.18);"></div>
      <div style="position: absolute; left: 32px; top: 24px; width: 1012px; height: 84px; border: 2px dashed #ff7a1a;"></div>
      <div style="position: absolute; left: 32px; top: 112px; width: 1012px; height: 108px; border: 2px dashed #ff7a1a;"></div>
      <div style="position: absolute; left: 32px; top: 224px; width: 1012px; height: 116px; border: 2px dashed #ff7a1a;"></div>
      <div style="position: absolute; left: 0; top: 344px; width: 1080px; height: 16px; background: rgba(255,122,26,.18);"></div>
      <div style="position: absolute; right: 44px; top: 122px; font-size: 20px; font-weight: 700; color: #ff7a1a;">M</div>
      <div style="position: absolute; right: 44px; top: 234px; font-size: 20px; font-weight: 700; color: #ff7a1a;">B</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bands":{"editor":"boolean","default":true},"$preview":{"width":1160,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return { bands: this.props.bands ?? true };
  }
}
</script>
</body>
</html>
