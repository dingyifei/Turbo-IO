<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glasses navigation</title>

</head>
<body>
<x-dc>
<helmet>

</style>
</helmet>
<div style="width: 1160px; height: 900px; box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; gap: 10px; background: #1c1c1e; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', system-ui, sans-serif;">

  <div role="img" aria-label="Proposed navigation: Turn right in 100 metres in the bottom band, trip detail in the middle, passing road at the top, map on the right" style="width: 1080px; height: 360px; position: relative; overflow: hidden; border-radius: 16px; background: #000000;">
    <svg style="position: absolute; left: 0; top: 0;" width="1080" height="360" viewBox="0 0 540 180" aria-hidden="true">
      <path d="M30 170v-34h30m-14-16 16 16-16 16" fill="none" stroke="#00ff00" stroke-width="8" stroke-linejoin="round"/>
      <g transform="translate(372 28)">
        <path d="M0 70h148M60 0v144M0 30l148 90" fill="none" stroke="#003800" stroke-width="3"/>

        <path d="M74 118l-9 22h18z" fill="#00ff00"/>

    </svg>
    <div style="position: absolute; left: 80px; top: 51px; font-size: 36px; line-height: 1; white-space: nowrap; color: #007700;">Passing Mission St</div>
    <div style="position: absolute; left: 80px; top: 152px; font-size: 40px; line-height: 1; white-space: nowrap; color: #00b000;">1.2 km · 10 min · 10:10</div>

    <div style="position: absolute; left: 384px; top: 258px; font-size: 48px; line-height: 1; font-weight: 500; white-space: nowrap; color: #00ff00;">Turn right</div>

      <div style="position: absolute; left: 0; top: 0; width: 1080px; height: 24px; background: rgba(255,122,26,.18);"></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bands":{"editor":"boolean","default":true},"$preview":{"width":1160,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { bands: this.props.bands ?? true };
  }
}
</script>
</body>
</html>
