<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glasses mini-app</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1160px; height: 560px; box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; gap: 10px; background: #1c1c1e; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', system-ui, sans-serif;">
  <div style="font-size: 13px; font-weight: 600; color: #c7c7cc; letter-spacing: .02em;">Proposed · TMG7 TAP1 mini-app (commute.json) · buttons become a focus list</div>
  <div role="img" aria-label="Proposed mini-app: next train in 4 minutes at the bottom, actions Later trains and Alerts in the middle with a caret under the focused one, title at the top" style="width: 1080px; height: 360px; position: relative; overflow: hidden; border-radius: 16px; background: #000000;">
    <div style="position: absolute; left: 80px; top: 51px; font-size: 36px; line-height: 1; color: #007700;">Commute · Line 2</div>
    <sc-for list="{{items}}" as="it" hint-placeholder-count="3">
      <div style="position: absolute; left: {{it.x}}px; top: 152px; font-size: 40px; line-height: 1; white-space: nowrap; color: {{it.color}};">{{it.label}}</div>
    </sc-for>
    <div style="position: absolute; left: {{caretX}}px; top: 202px; width: 48px; height: 6px; border-radius: 3px; background: #00ff00;"></div>
    <div style="position: absolute; left: 80px; top: 245px; font-size: 64px; line-height: 1; font-weight: 500; color: #00ff00;">4 min</div>
    <div style="position: absolute; left: 300px; top: 258px; font-size: 48px; line-height: 1; font-weight: 500; color: #00ff00;">to Downtown</div>
    <div style="position: absolute; left: 80px; top: 312px; font-size: 32px; line-height: 1; color: #00b000;">Platform 3 · then 12 min</div>
    <sc-if value="{{bands}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; left: 0; top: 0; width: 1080px; height: 24px; background: rgba(255,122,26,.18);"></div>
      <div style="position: absolute; left: 32px; top: 24px; width: 1012px; height: 84px; border: 2px dashed #ff7a1a;"></div>
      <div style="position: absolute; left: 32px; top: 112px; width: 1012px; height: 108px; border: 2px dashed #ff7a1a;"></div>
      <div style="position: absolute; left: 32px; top: 224px; width: 1012px; height: 116px; border: 2px dashed #ff7a1a;"></div>
      <div style="position: absolute; left: 0; top: 344px; width: 1080px; height: 16px; background: rgba(255,122,26,.18);"></div>
      <div style="position: absolute; right: 44px; top: 122px; font-size: 20px; font-weight: 700; color: #ff7a1a;">M</div>
      <div style="position: absolute; right: 44px; top: 234px; font-size: 20px; font-weight: 700; color: #ff7a1a;">B</div>
    </sc-if>
  </div>
  <div style="display: flex; gap: 10px; align-items: center;">
    <button onClick="{{up}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: #2c3020; color: #dbf67a; font-size: 15px; font-weight: 600;">Wheel up</button>
    <button onClick="{{down}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: #2c3020; color: #dbf67a; font-size: 15px; font-weight: 600;">Wheel down</button>
    <span style="font-size: 15px; color: #c7c7cc;">Focused: {{focusedLabel}} · press runs it · long press exits</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bands":{"editor":"boolean","default":true},"$preview":{"width":1160,"height":560}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { focus: 0 }; }
  renderVals() {
    const labels = ['Later trains', 'Alerts', 'Platform map'];
    const xs = [80, 400, 600];
    const f = this.state.focus;
    return {
      bands: this.props.bands ?? true,
      items: labels.map((label, i) => ({ label, x: xs[i], color: i === f ? '#00ff00' : '#007700' })),
      caretX: xs[f],
      focusedLabel: labels[f],
      up: () => this.setState({ focus: Math.max(0, f - 1) }),
      down: () => this.setState({ focus: Math.min(labels.length - 1, f + 1) })
    };
  }
}
</script>
</body>
</html>
