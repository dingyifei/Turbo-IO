<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glasses ride</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1160px; height: 560px; box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; gap: 10px; background: #1c1c1e; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', system-ui, sans-serif;">
  <div style="font-size: 13px; font-weight: 600; color: #c7c7cc; letter-spacing: .02em;">Proposed · TMG7 ride · what you check at the curb goes lowest</div>
  <div role="img" aria-label="Proposed ride: arriving in 3 minutes, plate D1234, at the bottom; white sedan in the middle; trip state at the top" style="width: 1080px; height: 360px; position: relative; overflow: hidden; border-radius: 16px; background: #000000;">
    <svg style="position: absolute; left: 0; top: 0;" width="1080" height="360" viewBox="0 0 540 180" aria-hidden="true">
      <path d="M22 160v-14l6-14h28l6 14v14zM22 160h40M28 168v-8M56 168v-8" fill="none" stroke="#00ff00" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="32" cy="150" r="2.5" fill="#00ff00"/><circle cx="52" cy="150" r="2.5" fill="#00ff00"/>
    </svg>
    <div style="position: absolute; left: 80px; top: 51px; font-size: 36px; line-height: 1; color: #007700;">Ride · driver on the way</div>
    <div style="position: absolute; left: 80px; top: 152px; font-size: 40px; line-height: 1; color: #00b000;">White sedan · Wang · North gate</div>
    <div style="position: absolute; left: 168px; top: 245px; font-size: 64px; line-height: 1; font-weight: 500; color: #00ff00;">3 min</div>
    <div style="position: absolute; left: 400px; top: 258px; font-size: 48px; line-height: 1; font-weight: 500; color: #00ff00; letter-spacing: .04em;">D·1234</div>
    <div style="position: absolute; left: 168px; top: 312px; font-size: 32px; line-height: 1; color: #00b000;">Plate</div>
    <sc-if value="{{bands}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; left: 0; top: 0; width: 1080px; height: 24px; background: rgba(255,122,26,.18);"></div>
      <div style="position: absolute; left: 32px; top: 24px; width: 1012px; height: 84px; border: 2px dashed #ff7a1a;"></div>
      <div style="position: absolute; left: 32px; top: 112px; width: 1012px; height: 108px; border: 2px dashed #ff7a1a;"></div>
      <div style="position: absolute; left: 32px; top: 224px; width: 1012px; height: 116px; border: 2px dashed #ff7a1a;"></div>
      <div style="position: absolute; left: 0; top: 344px; width: 1080px; height: 16px; background: rgba(255,122,26,.18);"></div>
      <div style="position: absolute; right: 44px; top: 34px; font-size: 20px; font-weight: 700; color: #ff7a1a;">T</div>
      <div style="position: absolute; right: 44px; top: 122px; font-size: 20px; font-weight: 700; color: #ff7a1a;">M</div>
      <div style="position: absolute; right: 44px; top: 234px; font-size: 20px; font-weight: 700; color: #ff7a1a;">B</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bands":{"editor":"boolean","default":true},"$preview":{"width":1160,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return { bands: this.props.bands ?? true };
  }
}
</script>
</body>
</html>
